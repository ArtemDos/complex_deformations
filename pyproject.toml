[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex_deformations_analysis"
version = "0.4.1"
description = "Анализ и визуализация деформирования по винтовым траекториям (Ansys, эксперимент)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "ipykernel>=6.25",
    "psutil>=5.9",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
jupyter = ["jupyter>=1.0.0"]
all = [
    "torch>=2.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
